[project]
name = "gndless_oscillator"
version = "0.1.0"
authors = ["Akiyuki Okayasu"]
description = "Periodic waveform and noise oscillators for Veryl."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/gndless-oscillator-veryl"

[build]
sources = ["src"]
target = { type = "directory", path = "target" }

[test]

[dependencies]
gndless_fixedpoint = { github = "AkiyukiOkayasu/gndless-fixedpoint-veryl", version = "0.1.0" }
gndless_nco = { github = "AkiyukiOkayasu/gndless-nco-veryl", version = "0.1.0" }

[publish]
register = true
bump_commit = true
publish_commit = true
